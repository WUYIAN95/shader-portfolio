<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <title>Shader Portfolio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #080a0d; color: #f1f0ec; }
    main { width: min(760px, 90vw); }
    .eyebrow { color: #a2a6aa; font: 600 10px/1.2 ui-monospace, monospace; letter-spacing: .16em; }
    h1 { margin: 12px 0 36px; font-size: clamp(34px, 7vw, 68px); font-weight: 400; letter-spacing: -.04em; }
    .studies { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    a { display: block; min-height: 190px; padding: 24px; color: inherit; text-decoration: none; background: #11151a; border: 1px solid #30343a; border-radius: 14px; transition: transform .2s, border-color .2s, background .2s; }
    a:hover, a:focus-visible { background: #171c22; border-color: #f1a0a8; transform: translateY(-3px); outline: none; }
    .number { color: #f1a0a8; font: 11px ui-monospace, monospace; }
    .name { margin-top: 46px; font-size: 22px; }
    .description { margin-top: 8px; color: #a2a6aa; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">REAL-TIME WEBGL / SHADER PORTFOLIO</div>
    <h1>Two shader studies.</h1>
    <section class="studies" aria-label="Shader studies">
      <a href="fractal-bloom/"><div class="number">01</div><div class="name">Fractal Bloom</div><div class="description">A colorful animated fractal study.</div></a>
      <a href="octahedron-tunnel/"><div class="number">02</div><div class="name">Octahedron Tunnel</div><div class="description">A ray-marched tunnel of repeating octahedra.</div></a>
    </section>
  </main>
</body>
</html>
